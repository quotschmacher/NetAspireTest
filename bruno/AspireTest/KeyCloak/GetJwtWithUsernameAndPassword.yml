info:
  name: Get JWT with Username and Password
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/realms/notes/protocol/openid-connect/token
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: client_id
        value: notes-public-client
      - name: username
        value: test@test.com
      - name: password
        value: "123"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let data = res.body;
        bru.setVar("token", data.access_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
